org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Project lives on D: while the Pub/Gradle caches live on C: — Kotlin's
# relocatable incremental cache crashes computing a relative path across
# drive letters ("this and base files have different roots"). Disabling
# incremental Kotlin compilation avoids that crashing code path entirely.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
